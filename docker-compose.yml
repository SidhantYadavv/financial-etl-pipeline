services:
  postgres:
    image: postgres:17
    container_name: financial-etl-postgres
    environment:
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
      POSTGRES_DB: financial_news
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl -d financial_news"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
