name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: etl
          POSTGRES_PASSWORD: etl
          POSTGRES_DB: financial_news_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U etl -d financial_news_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://etl:etl@localhost:5434/financial_news_test
      TEST_DATABASE_URL: postgresql+psycopg://etl:etl@localhost:5434/financial_news_test
      NEWS_API_KEY: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          python -m nltk.downloader vader_lexicon

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Alembic migrations
        run: |
          alembic upgrade head
          alembic check

      - name: Pytest
        run: pytest
